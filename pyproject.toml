[project]
name = "camera-module"
version = "0.1.0"
description = "Local Python tools for ESP32 camera, USB preview, and CSI collection"
requires-python = ">=3.10"
dependencies = [
    "esptool",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "pyqt5",
    "pyqtgraph",
    "pyserial",
    "scipy",
    "sounddevice",
    "statsmodels",
]

[tool.uv]
package = false

[dependency-groups]
csi = [
    "psycopg[binary]>=3.1",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
whisper = [
    "openai-whisper>=20240930",
    "torch",
    "torchaudio",
    "mlx-whisper>=0.4.0",
    "mlx>=0.20",
    "webrtcvad>=2.0.10",
    "setuptools>=84.0.0",
    "speechbrain>=1.0.0",
    "pyannote.audio>=3.1.0",
]
