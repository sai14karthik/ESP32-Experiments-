[project]
name = "csi-presence-c5"
version = "0.1.0"
description = "Binary CSI presence (empty vs occupied) with 2× ESP32-C5 + LabPSK + CV ground truth"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyserial>=3.5",
  "opencv-python>=4.8,<5",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "ultralytics>=8.3",
]

[project.scripts]
csi-collect = "csi_presence.data_collector.collect_session:main"
csi-cv-label = "csi_presence.cv_ground_truth.person_labeler:main"
csi-train = "csi_presence.train.train_presence:main"
csi-live = "csi_presence.live.live_presence:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csi_presence"]

[tool.uv]
package = true
