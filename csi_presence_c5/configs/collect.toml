[session]
# Sliding window for features / labels
# Smaller hop = more labeled windows per second (same CSI stream, denser GT)
window_sec = 1.0
hop_sec = 0.125
# Default run length (override with --seconds)
seconds = 300
csi_baud = 115200

[cv]
# Default GT camera = ESP Sense at .15 (CameraWebServer MJPEG), not local webcam
camera = "http://10.128.93.15:81/stream"
# Alt via MediaMTX: "rtsp://10.128.93.13:8554/cam_sense"
# Local webcam: "0"
# Presets: fast | balanced | accurate | max  (default accurate = yolo26m-pose)
quality = "accurate"
# Optional hard override (same as POSE_MODEL env)
# model = "yolo26l-pose.pt"
# Stricter GT: need several agreeing frames (kills empty-room YOLO flickers)
min_person_frames = 4
# Override YOLO conf for presence (default in code 0.45; healthcare live uses 0.25)
person_conf = 0.45

[labels]
# empty | occupied | auto (from YOLO26-pose)
default = "auto"

[postgres]
# Dual-write CSI packets + labeled windows to Mini Postgres (csi DB).
# Override URL with DATABASE_URL or --database-url. Disable with --no-postgres.
enable = true
# url = "postgresql:///csi"
