[session]
# Sliding window for features / labels
window_sec = 1.0
hop_sec = 0.5
csi_baud = 115200

[cv]
# Default GT camera = ESP Sense at .15 (CameraWebServer MJPEG), not local webcam
camera = "http://10.128.93.15:81/stream"
# Alt via MediaMTX: "rtsp://10.128.93.13:8554/cam_sense"
# Local webcam: "0"
# Presets: fast | balanced | accurate | max  (default accurate = yolo26m-pose)
quality = "accurate"
# Optional hard override (same as POSE_MODEL env)
# model = "yolo26l-pose.pt"
# Frames with a person needed in a window to mark occupied
min_person_frames = 2

[labels]
# empty | occupied | auto (from YOLO26-pose)
default = "auto"
