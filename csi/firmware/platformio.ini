; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; This is the CSI capture firmware only. The other board experiments
; (S3 mic, S3 camera, C6 LCD) live in their original project.

[platformio]
default_envs = seeed_xiao_esp32c6

; The official espressif32 platform ships Arduino core 2.0.x, which predates
; the ESP32-C6 (its C6 board only supports espidf). The pioarduino fork
; bundles Arduino core 3.x, required for C6/H2/P4 Arduino builds.
; "stable" always pulls the latest stable release; pin a tag (e.g. #55.03.38)
; for reproducibility.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

; ── XIAO ESP32-C6 — WiFi CSI capture (src/main.cpp) ──────────────────────
[env:seeed_xiao_esp32c6]
board = seeed_xiao_esp32c6
; The XIAO ESP32-C6 uses the native USB-CDC port for Serial. This routes
; Serial.print() to the USB cable instead of the hardware UART.
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
; Shared wire-format library, header-only, from this monorepo. symlink://
; (not file://) so header edits are picked up without reinstalling; the
; relative path resolves against this project dir (firmware/), so the
; sibling layout firmware/ <-> shared/ is load-bearing.
lib_deps =
	csi-core=symlink://../shared/csi-core
