###############################################
# Local MediaMTX lab config (this Mac / Mini)
# Paths: cam1 = Mac webcam, cam_xiao = XIAO camera
#
# Preferred (forever): CameraRTSPWiFi on board → MediaMTX pulls RTSP.
#   XIAO_RTSP_URL=rtsp://10.128.93.25:8554/mjpeg/1 ./scripts/mediamtx_run.sh
#
# Fallback (MJPEG + ffmpeg): CameraWebServerWiFi → runOnInit publish_xiao.
#   mediamtx_run.sh fills rtsp://10.128.93.25:8554/mjpeg/1 / __CAM_XIAO_RUN_ON_INIT__.
#   Do NOT also run publish_xiao.sh by hand unless XIAO_EXTERNAL_PUBLISH=1.
###############################################

logLevel: info
logDestinations: [stdout]

# Publisher can pause briefly on ESP Wi‑Fi; keep sessions alive.
readTimeout: 60s
writeTimeout: 60s
udpMaxPayloadSize: 1400

###############################################
# Protocols
###############################################

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtpAddress: :8002
rtcpAddress: :8003

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: yes
# fmp4 is more tolerant of short publisher gaps than lowLatency.
hlsVariant: fmp4
hlsSegmentDuration: 2s
hlsPartDuration: 500ms
hlsSegmentCount: 7

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcAdditionalHosts: [10.128.93.23]
webrtcICEServers2: []

###############################################
# Paths
###############################################

paths:
  cam1:
    source: publisher

  cam_xiao:
    # Replaced by mediamtx_run.sh:
    #   RTSP pull: source: rtsp://…  (no runOnInit)
    #   MJPEG push: source: publisher + runOnInit publish_xiao
    source: rtsp://10.128.93.25:8554/mjpeg/1
    sourceProtocol: tcp
# RTSP pull mode (no ffmpeg runOnInit)
