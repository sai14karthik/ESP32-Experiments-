# Both stay up without a terminal (restart: unless-stopped).
# The publisher uses the Mini's network so it can open LAN cameras.
#   docker compose up -d --build
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8888:8888"
    command: ["/mediamtx.yml"]
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  cameras:
    build: .
    network_mode: host
    restart: unless-stopped
    environment:
      # MediaMTX is published on the Mini's LAN address. 127.0.0.1 inside
      # this container is not that port.
      MTX_HOST: 10.128.93.13
      RTSP_PORT: "8554"
      MEDIAMTX_LAN_IP: ${MEDIAMTX_LAN_IP:-10.128.93.13}
      API_PORT: "8090"
      DATA_PATH: /data/cameras.json
    volumes:
      - ./data:/data
    depends_on:
      - mediamtx
