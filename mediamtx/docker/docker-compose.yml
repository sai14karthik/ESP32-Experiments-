# MediaMTX only. On the Mac Mini, Docker cannot open LAN camera ports.
# Start the server here, then run the publisher on the Mini itself:
#   docker compose up -d
#   ./run_publisher.sh

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8888:8888"
    command: ["/mediamtx.yml"]
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  # Optional. Docker Desktop on the Mini cannot reach 10.128.93.x,
  # so the lab publisher is ./run_publisher.sh on the host.
  cameras:
    profiles: ["in-container"]
    build: .
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      MTX_HOST: mediamtx
      RTSP_PORT: "8554"
      MEDIAMTX_LAN_IP: ${MEDIAMTX_LAN_IP:-10.128.93.13}
      API_PORT: "8090"
      DATA_PATH: /data/cameras.json
    volumes:
      - camdata:/data
    depends_on:
      - mediamtx

volumes:
  camdata:
