# RTSP reads are public to clients that can reach port 8554. Publishing and
# control API access require credentials supplied by the installer.
api: yes
apiAddress: :9997
rtsp: yes
rtspTransports:
  - tcp
rtspAddress: :8554

authMethod: internal
authInternalUsers:
  - user: any
    permissions:
      - action: read
      - action: playback
  - user: publisher
    pass:
    permissions:
      - action: publish
  - user: admin
    pass:
    permissions:
      - action: api

paths:
  all_others:
    source: publisher
    # Allow ffmpeg to reclaim a path after a drop (false left cam_sense3/4 stuck 404).
    overridePublisher: true
