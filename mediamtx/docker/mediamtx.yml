# Same server settings as mycareapp-main/mediamtx.yml.
# auth stays open so a GPU and the Mini publisher can use the
# published ports, not only 127.0.0.1 inside the container.
api: yes
apiAddress: :9997
rtsp: yes
rtspTransports:
  - tcp
rtspAddress: :8554

authMethod: internal
authInternalUsers:
  - user: any
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

paths:
  all_others:
    source: publisher
    overridePublisher: true
