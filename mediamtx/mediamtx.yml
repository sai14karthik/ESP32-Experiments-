###############################################
# Local MediaMTX lab config (this Mac / Mini)
# Paths: cam1 = Mac webcam, cam_xiao = XIAO camera
#
# Lab default (CameraWebServerWiFi):
#   ESP MJPEG HTTP → ffmpeg H.264 publish → MediaMTX
#   → viewers use RTSP / HLS / WebRTC / RTMP
#   ./scripts/mediamtx_run.sh
#
# Do NOT also run publish_xiao.sh by hand unless XIAO_EXTERNAL_PUBLISH=1.
###############################################

logLevel: info
logDestinations: [stdout]

# Publisher can pause briefly on ESP Wi‑Fi; keep sessions alive.
readTimeout: 60s
writeTimeout: 60s
udpMaxPayloadSize: 1400

###############################################
# Protocols
###############################################

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtpAddress: :8002
rtcpAddress: :8003

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: yes
# fmp4 is more tolerant of short publisher gaps than lowLatency.
hlsVariant: fmp4
hlsSegmentDuration: 2s
hlsPartDuration: 500ms
hlsSegmentCount: 7

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcAdditionalHosts: [10.128.93.23]
webrtcICEServers2: []

###############################################
# Paths
###############################################

paths:
  cam1:
    source: publisher

  cam_xiao:
    # Replaced by mediamtx_run.sh (publisher + ffmpeg H.264 for browsers).
    source: __CAM_XIAO_SOURCE__
    sourceProtocol: tcp
    __CAM_XIAO_RUN_ON_INIT_BLOCK__
