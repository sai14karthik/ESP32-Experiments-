###############################################
# MediaMTX lab — RTSP only (no ffmpeg)
# ESP Micro-RTSP MJPEG → MediaMTX TCP proxy → ffplay
#
# Knobs from mediamtx-repo:
#   docs/2-features/12-proxy.md
#   docs/2-features/28-decrease-packet-loss.md
###############################################

logLevel: info
logDestinations: [stdout]

readTimeout: 30s
writeTimeout: 30s
# MJPEG bursts; stops "reader is too slow" under Wi‑Fi jitter
writeQueueSize: 2048
udpMaxPayloadSize: 1450
udpReadBufferSize: 1000000

rtsp: yes
rtspAddress: :8554
# Viewers + reliability on LabPSK
rtspTransports: [tcp]
rtpAddress: :8002
rtcpAddress: :8003

# Parked while focusing on RTSP
rtmp: no
hls: no
webrtc: no
srt: no

paths:
  cam1:
    source: publisher

  cam_xiao:
    # Direct pull from board (TCP interleaved). No ffmpeg.
    # Same URL shape as esp32cam-rtsp / Micro-RTSP: /mjpeg/1
    source: __XIAO_RTSP_SOURCE__
    rtspTransport: tcp
    sourceOnDemand: no
