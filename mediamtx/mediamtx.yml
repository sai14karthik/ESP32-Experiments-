###############################################
# Simple: ESP RTSP → MediaMTX → VLC (no ffmpeg)
###############################################

logLevel: info
logDestinations: [stdout]

readTimeout: 30s
writeTimeout: 30s
writeQueueSize: 4096

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

hls: no
webrtc: no
rtmp: no
srt: no

paths:
  cam_xiao:
    source: __XIAO_RTSP_SOURCE__
    rtspTransport: tcp
