###############################################
# MediaMTX lab config — aligned with official docs
# https://mediamtx.org/docs/publish/generic-webcams
# https://mediamtx.org/docs/features/decrease-packet-loss
# https://mediamtx.org/docs/references/configuration-file
###############################################

logLevel: info
logDestinations: [stdout]

readTimeout: 20s
writeTimeout: 20s
# Official fix for "reader is too slow, discarding N frames"
# https://mediamtx.org/docs/features/decrease-packet-loss
writeQueueSize: 1024
udpMaxPayloadSize: 1200

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtpAddress: :8002
rtcpAddress: :8003

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
# Default in MediaMTX is false — only remux when someone opens HLS.
# Keeping this true caused HLS muxer lag → discarded frames for WebRTC too.
hlsAlwaysRemux: no
# lowLatency requires hlsSegmentCount >= 7 (MediaMTX validates this).
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7
hlsSegmentMaxSize: 50M

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [__WEBRTC_HOST__]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcICEServers2: []

paths:
  cam1:
    source: publisher

  cam_xiao:
    source: publisher
    # Filled by mediamtx_run.sh — official pattern: runOnInit + runOnInitRestart
    # https://mediamtx.org/docs/features/hooks
    runOnInit: __CAM_XIAO_RUN_ON_INIT__
    runOnInitRestart: yes
