###############################################
# Local MediaMTX lab config (this Mac only)
# Paths: cam1 = Mac webcam, cam_xiao = XIAO via FFmpeg
#
# Official MediaMTX pattern for continuous publish:
#   runOnInit + runOnInitRestart
#   https://mediamtx.org/docs → hooks / generic webcams
#
# mediamtx_run.sh fills __CAM_XIAO_RUN_ON_INIT__ with run_xiao_publish.sh
# (publish_xiao.sh). Prefer XIAO_RTSP_URL=rtsp://… for continuous live;
# XIAO_MJPEG_URL=http://… falls back to /capture polls. One terminal —
# do NOT also run publish_xiao.sh by hand unless XIAO_EXTERNAL_PUBLISH=1.
###############################################

logLevel: info
logDestinations: [stdout]

# Publisher can pause briefly on ESP Wi‑Fi; keep sessions alive.
readTimeout: 60s
writeTimeout: 60s
# Small queue = drop late frames instead of buffering 3–4s of lag on WebRTC.
writeQueueSize: 32
udpMaxPayloadSize: 1200

###############################################
# Protocols
###############################################

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtpAddress: :8002
rtcpAddress: :8003

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: yes
# HLS is backup only (~2–4s lag). For live feel use WebRTC :8889 — not :8888.
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7
hlsSegmentMaxSize: 50M

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcIPsFromInterfaces: false
# Filled by mediamtx_run.sh with this Mac's LAN IP (home Wi‑Fi).
webrtcAdditionalHosts: [__WEBRTC_HOST__]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcICEServers2: []

###############################################
# Paths
###############################################

paths:
  cam1:
    source: publisher

  cam_xiao:
    source: publisher
    # Replaced by mediamtx_run.sh (MediaMTX restarts this forever if it exits).
    runOnInit: __CAM_XIAO_RUN_ON_INIT__
    runOnInitRestart: yes
