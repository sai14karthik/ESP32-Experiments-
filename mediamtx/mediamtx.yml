###############################################
# MediaMTX lab — quality + smooth (delay OK)
###############################################

logLevel: info
logDestinations: [stdout]

readTimeout: 30s
writeTimeout: 30s
writeQueueSize: 1024
udpMaxPayloadSize: 1450

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtpAddress: :8002
rtcpAddress: :8003

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
# Pre-build HLS so Safari has a buffer (smoother; a few seconds delay is OK).
hlsAlwaysRemux: yes
hlsVariant: fmp4
hlsSegmentDuration: 2s
hlsSegmentCount: 10
hlsSegmentMaxSize: 50M

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [__WEBRTC_HOST__]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcICEServers2: []

paths:
  cam1:
    source: publisher

  cam_xiao:
    source: publisher
    runOnInit: __CAM_XIAO_RUN_ON_INIT__
    runOnInitRestart: yes
