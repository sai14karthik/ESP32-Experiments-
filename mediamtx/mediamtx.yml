###############################################
# Local MediaMTX lab config (this Mac only)
# Paths: cam1 = Mac webcam, cam_xiao = XIAO MJPEG bridge
###############################################

logLevel: info
logDestinations: [stdout]

# ESP→ffmpeg can stall for seconds; default 10s drops the publisher and kills viewers.
readTimeout: 30s
writeTimeout: 30s
# Keep remuxed H264 under ethernet MTU (avoids "RTP packets are too big" churn).
udpMaxPayloadSize: 1400

###############################################
# Protocols
###############################################

rtsp: yes
rtspAddress: :8554
# TCP only for lab publish/play — UDP ICE/RTP was flaky across LabPSK clients.
rtspTransports: [tcp]
# Avoid clash with anything already bound on :8000
rtpAddress: :8002
rtcpAddress: :8003

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: yes
hlsVariant: lowLatency

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
# Advertise Mini LabPSK IP so remote WebRTC clients don't get 127.0.0.1 ICE.
webrtcAdditionalHosts: [10.128.93.23]
webrtcICEServers2: []

###############################################
# Paths (publisher = FFmpeg / client pushes in)
###############################################

paths:
  cam1:
    source: publisher

  cam_xiao:
    source: publisher
