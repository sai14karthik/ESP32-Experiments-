###############################################
# MediaMTX lab — ESP32-CAM / XIAO → all protocols
#
# Official pattern (MediaMTX maintainer, discussion #3575):
#   ESP MJPEG HTTP is NOT a native MediaMTX source.
#   Use FFmpeg in runOnInit to ingest, then viewers use
#   RTSP / HLS / WebRTC / RTMP from MediaMTX.
#
#   https://github.com/bluenviron/mediamtx/discussions/3575
#   https://mediamtx.org/docs/usage/hooks
#   https://mediamtx.org/docs/publish/ffmpeg
#
# Browsers need H.264 (HLS/WebRTC do not support MJPEG):
#   https://mediamtx.org/docs/read/hls
#   https://mediamtx.org/docs/read/webrtc
#
# Start: ./scripts/mediamtx_run.sh
# Do NOT also run publish_xiao.sh unless XIAO_EXTERNAL_PUBLISH=1.
###############################################

logLevel: info
logDestinations: [stdout]

readTimeout: 60s
writeTimeout: 60s
writeQueueSize: 1024
udpMaxPayloadSize: 1400

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtpAddress: :8002
rtcpAddress: :8003

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: yes
# Longer segments: ESP capture jitter was stretching 2s→3s and killing Safari/iOS.
hlsVariant: fmp4
hlsSegmentDuration: 4s
hlsPartDuration: 1s
hlsSegmentCount: 10

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcAdditionalHosts: [10.128.93.23]
webrtcICEServers2: []

paths:
  cam1:
    source: publisher

  cam_xiao:
    source: publisher
    # Filled by mediamtx_run.sh → absolute path to bridge script.
    runOnInit: __CAM_XIAO_RUN_ON_INIT__
    runOnInitRestart: yes
