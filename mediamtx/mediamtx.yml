###############################################
# Base MediaMTX config. Paths are generated by
# scripts/mediamtx_run.sh (N× CameraWebServerWiFi → RTSP).
###############################################

logLevel: info
logDestinations: [stdout]

readTimeout: 30s
writeTimeout: 30s
writeQueueSize: 8192

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 10M

webrtc: no
rtmp: no
srt: no

# `paths:` appended by mediamtx_run.sh
paths: {}
