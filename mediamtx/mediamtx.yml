###############################################
# ESP HTTP MJPEG → ffmpeg H.264 → MediaMTX :8554/cam_xiao
# (S3 has no HW H.264; MJPEG remux on host for VLC/colleague RTSP)
###############################################

logLevel: info
logDestinations: [stdout]

readTimeout: 30s
writeTimeout: 30s
writeQueueSize: 4096

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# Optional LAN backup for browsers; primary watch path is RTSP.
# Default hlsVariant is lowLatency → MediaMTX requires hlsSegmentCount >= 7.
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 10M

webrtc: no
rtmp: no
srt: no

paths:
  cam_xiao:
    source: publisher
    # URL injected by mediamtx_run.sh (placeholder below).
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning
      -fflags nobuffer+genpts+discardcorrupt
      -flags low_delay
      -probesize 32
      -analyzeduration 0
      -use_wallclock_as_timestamps 1
      -f mjpeg
      -i __XIAO_MJPEG_URL__
      -an
      -vf fps=15,format=yuv420p
      -c:v libx264
      -preset ultrafast
      -tune zerolatency
      -profile:v baseline
      -level 3.1
      -bf 0
      -g 15
      -keyint_min 15
      -b:v 1000k
      -maxrate 1000k
      -bufsize 500k
      -x264-params scenecut=0:repeat-headers=1
      -flush_packets 1
      -muxdelay 0
      -muxpreload 0
      -f rtsp
      -rtsp_transport tcp
      rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
