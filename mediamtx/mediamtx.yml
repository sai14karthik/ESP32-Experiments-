###############################################
# MediaMTX lab — ESP / XIAO → RTSP + HLS + WebRTC
#
# Official ESP MJPEG ingest (maintainer):
#   FFmpeg runOnInit → publish H.264 into MediaMTX
#   https://github.com/bluenviron/mediamtx/discussions/3575
#   https://mediamtx.org/docs/usage/hooks
#   https://mediamtx.org/docs/publish/ffmpeg
#
# WebRTC on LabPSK: UDP ICE often fails (client isolation / firewall)
# → "peer connection closed". MediaMTX fix = ICE over TCP:
#   https://mediamtx.org/docs/features/webrtc-specific-features
#
# Start: ./scripts/mediamtx_run.sh
###############################################

logLevel: info
logDestinations: [stdout]

readTimeout: 60s
writeTimeout: 60s
writeQueueSize: 1024
udpMaxPayloadSize: 1200

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: yes
# fmp4 + short playlist; use HLS when WebRTC ICE fails on LabPSK.
hlsVariant: fmp4
hlsSegmentDuration: 2s
hlsPartDuration: 500ms
hlsSegmentCount: 5

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
# LAN IP clients must use (Mini Ethernet on LabPSK).
webrtcAdditionalHosts: [10.128.93.23]
# LabPSK / isolation: prefer TCP ICE (official when UDP is blocked).
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcICEServers2: []

paths:
  cam1:
    source: publisher

  cam_xiao:
    source: publisher
    runOnInit: __CAM_XIAO_RUN_ON_INIT__
    runOnInitRestart: yes
