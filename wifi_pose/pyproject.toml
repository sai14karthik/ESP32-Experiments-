[project]
name = "wifi-pose"
version = "0.1.0"
description = "Wi-Fi multi-person 3D pose app: GT collect now; train/live later (SoftAP CSI + RealSense)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "mediapipe>=0.10.14",
]

[project.scripts]
wifi-pose-record = "wifi_pose.record:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true
